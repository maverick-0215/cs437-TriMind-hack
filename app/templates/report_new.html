{% extends "base.html" %}
{% from "_macros.html" import csrf, category_select %}
{% block title %}File a lost report{% endblock %}
{% block content %}
<h1>File a lost report</h1>
<form class="stack" method="post">
  {{ csrf() }}
  <label>Category {{ category_select(categories, form.get('category', '')) }}</label>
  <label>What did you lose? <input name="title" required placeholder="Blue steel bottle" value="{{ form.get('title', '') }}"></label>
  <label>Date lost (approximate) <input type="date" name="date_lost" required max="{{ today.isoformat() }}" value="{{ form.get('date_lost', '') }}"></label>
  <label>Where did you lose it? <input name="place_lost" required placeholder="Library, 2nd floor" value="{{ form.get('place_lost', '') }}"></label>
  <label>Private identifying details <small class="muted">Only security staff can see this.</small>
    <textarea name="private_details" required rows="4" placeholder="Scratch near the cap, a sticker…">{{ form.get('private_details', '') }}</textarea></label>
  <button>File report</button>
</form>
{% endblock %}
