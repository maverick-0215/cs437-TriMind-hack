{% extends "base.html" %}
{% from "_macros.html" import csrf %}
{% block title %}Claim {{ item.title }}{% endblock %}
{% block content %}
<h1>Claim: {{ item.title }}</h1>
<p class="muted">{{ item.category }} · found {{ item.date_found.strftime('%d %b %Y') }} · {{ item.general_area }}</p>
<form class="stack" method="post">
  {{ csrf() }}
  <label>Describe features that prove it is yours <small class="muted">Security will compare these with the item.</small>
    <textarea name="features" required rows="4" placeholder="Colour, marks, stickers, contents…"></textarea></label>
  <button>Submit claim</button>
</form>
{% endblock %}
